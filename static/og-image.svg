<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Logo mark (top left) -->
  <g transform="translate(80 80)">
    <path d="M2 48h48" fill="none" stroke="#16181A" stroke-width="14" stroke-linecap="round"/>
    <path d="M50 48h12" fill="none" stroke="#56E83F" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 48 C78 48 92 38 96 24 C100 8 88 -4 74 -4 C60 -4 52 4 52 20"
          fill="none" stroke="#16181A" stroke-width="9" stroke-linecap="round"/>
    <path d="M52 20l3 14 13-5"
          fill="none" stroke="#56E83F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="140"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="42" font-weight="700" fill="#16181A">Critique</text>

  <!-- Main headline -->
  <text x="80" y="300"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="72" font-weight="700" fill="#111111"
        letter-spacing="-2">Stop getting "Looks good."</text>

  <!-- Subheadline -->
  <text x="80" y="400"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="42" font-weight="500" fill="#4b5563">Ask one question. Get real answers.</text>

  <!-- Bottom accent line -->
  <rect x="80" y="470" width="80" height="4" rx="2" fill="#56E83F"/>

  <!-- Domain -->
  <text x="80" y="540"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="28" font-weight="600" fill="#6b7280">critique.page</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Results — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: none;
        }

        .page-header {
            margin-bottom: var(--space-6);
        }

        .page-header h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .page-header .project-name {
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-top: var(--space-2);
        }

        .total-badge {
            display: inline-block;
            background: var(--surface-muted);
            padding: var(--space-2) var(--space-4);
            border-radius: 999px;
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
            margin-top: var(--space-3);
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding: var(--space-4) var(--space-5);
            margin-bottom: var(--space-6);
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .question-text {
            font-weight: 600;
            font-size: var(--text-lg);
            line-height: 1.4;
        }

        .quick-signals {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .signal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            text-align: center;
        }

        .signal-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
        }

        .signal-label {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: var(--space-1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
            margin-bottom: var(--space-6);
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
        }

        .stat-card h3 {
            font-size: var(--text-base);
            font-weight: 700;
            margin-bottom: var(--space-4);
            color: var(--text-primary);
        }

        .bar-row {
            margin-bottom: var(--space-3);
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-1);
        }

        .bar-label {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .bar-meta {
            font-size: var(--text-xs);
            color: var(--text-muted);
        }

        .bar-track {
            height: 8px;
            background: var(--surface-muted);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width var(--transition-normal);
        }

        .bar-fill.very_clear { background: var(--success); }
        .bar-fill.mostly_clear { background: var(--warning); }
        .bar-fill.confusing { background: var(--danger); }
        .bar-fill.yes { background: var(--success); }
        .bar-fill.maybe { background: var(--warning); }
        .bar-fill.no { background: var(--danger); }

        .written-feedback {
            margin-top: var(--space-6);
        }

        .written-feedback h3 {
            font-size: var(--text-lg);
            font-weight: 700;
            margin-bottom: var(--space-4);
        }

        .feedback-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .feedback-meta {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .feedback-text {
            color: var(--text-primary);
            font-size: var(--text-sm);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .action-buttons {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            margin-top: var(--space-6);
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .quick-signals {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/">Submit</a>
        </nav>
    </header>

    <main class="container-wide">
        <a href="/project/' + projectId + '" class="back-link">Back to project</a>
        <div id="content">
            <div class="loading-state"><div class="loading-spinner"></div><p>Loading results...</p></div>
        </div>
    </main>

    <script>
        const projectId = window.location.pathname.split('/')[2];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clarityLabel(value) {
            const labels = { 'very_clear': 'Very clear', 'mostly_clear': 'Mostly clear', 'confusing': 'Confusing' };
            return labels[value] || value;
        }

        function wouldUseLabel(value) {
            const labels = { 'yes': 'Yes', 'maybe': 'Maybe', 'no': 'No' };
            return labels[value] || value;
        }

        function renderBar(label, pct, count, cssClass) {
            return '<div class="bar-row">' +
                '<div class="bar-header">' +
                '<span class="bar-label">' + label + '</span>' +
                '<span class="bar-meta">' + pct + '% · ' + count + ' of ' + totalResponses + '</span>' +
                '</div>' +
                '<div class="bar-track"><div class="bar-fill ' + cssClass + '" style="width: ' + pct + '%"></div></div>' +
                '</div>';
        }

        let totalResponses = 0;

        function countResponses(data) {
            if (data.is_owner && data.responses.length > 0) {
                totalResponses = data.responses.length;
            } else {
                totalResponses = data.stats.total;
            }
        }

        function renderSummary(stats) {
            let summary = '';
            if (stats.total === 0) return summary;
            if (stats.total === 1) {
                summary = '<p style="color:var(--text-muted);font-size:var(--text-sm);margin-bottom:var(--space-4);">1 person responded.</p>';
            } else {
                summary = '<p style="color:var(--text-muted);font-size:var(--text-sm);margin-bottom:var(--space-4);">' + stats.total + ' people responded.</p>';
            }
            return summary;
        }

        function renderPage(data) {
            const content = document.getElementById('content');
            let html = '';

            // Header
            html += '<div class="page-header">';
            html += '<h2>Feedback results</h2>';
            html += '<p class="project-name">' + escapeHtml(data.project_title) + '</p>';
            html += '<span class="total-badge">' + data.stats.total + ' total response' + (data.stats.total !== 1 ? 's' : '') + '</span>';
            html += '</div>';

            // Question
            if (data.question_text) {
                html += '<div class="question-card">';
                html += '<div class="question-label">The Question</div>';
                html += '<div class="question-text">' + escapeHtml(data.question_text) + '</div>';
                html += '</div>';
            }

            if (data.stats.total === 0) {
                html += '<div class="empty-state">';
                html += '<h3>No feedback yet</h3>';
                html += '<p>Share your project to start collecting honest feedback.</p>';
                html += '<div class="action-buttons" style="justify-content:center;">';
                html += '<a href="/project/' + projectId + '" class="btn btn-primary">Share project</a>';
                html += '</div>';
                html += '</div>';
                content.innerHTML = html;
                return;
            }

            // Quick signals
            html += '<div class="quick-signals">';
            html += '<div class="signal-card"><div class="signal-value">' + data.stats.total + '</div><div class="signal-label">Total responses</div></div>';
            html += '<div class="signal-card"><div class="signal-value">' + data.stats.clarity.very_clear + '%</div><div class="signal-label">Very clear</div></div>';
            html += '<div class="signal-card"><div class="signal-value">' + data.stats.would_use.yes + '%</div><div class="signal-label">Would use</div></div>';
            html += '</div>';

            // Summary
            html += renderSummary(data.stats);

            // Stats grid
            html += '<div class="stats-grid">';
            html += '<div class="stat-card"><h3>How clear is it?</h3>';
            html += renderBar('Very clear', data.stats.clarity.very_clear, Math.round(data.stats.clarity.very_clear / 100 * totalResponses), 'very_clear');
            html += renderBar('Mostly clear', data.stats.clarity.mostly_clear, Math.round(data.stats.clarity.mostly_clear / 100 * totalResponses), 'mostly_clear');
            html += renderBar('Confusing', data.stats.clarity.confusing, Math.round(data.stats.clarity.confusing / 100 * totalResponses), 'confusing');
            html += '</div>';
            html += '<div class="stat-card"><h3>Would you use it?</h3>';
            html += renderBar('Yes', data.stats.would_use.yes, Math.round(data.stats.would_use.yes / 100 * totalResponses), 'yes');
            html += renderBar('Maybe', data.stats.would_use.maybe, Math.round(data.stats.would_use.maybe / 100 * totalResponses), 'maybe');
            html += renderBar('No', data.stats.would_use.no, Math.round(data.stats.would_use.no / 100 * totalResponses), 'no');
            html += '</div>';
            html += '</div>';

            // Written feedback (owner only)
            if (data.is_owner && data.responses.length > 0) {
                const withSuggestions = data.responses.filter(function(r) { return r.suggestion; });
                if (withSuggestions.length > 0) {
                    html += '<div class="written-feedback">';
                    html += '<h3>Written feedback</h3>';
                    withSuggestions.forEach(function(r) {
                        html += '<div class="feedback-card">';
                        html += '<div class="feedback-meta">';
                        html += '<span>Clarity: ' + clarityLabel(r.clarity) + '</span>';
                        html += '<span>Would use: ' + wouldUseLabel(r.would_use) + '</span>';
                        html += '</div>';
                        html += '<p class="feedback-text">' + escapeHtml(r.suggestion) + '</p>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
            }

            // Actions
            html += '<div class="action-buttons">';
            html += '<a href="/project/' + projectId + '" class="btn btn-primary">Get more feedback</a>';
            html += '<a href="/discover" class="btn btn-secondary">Discover projects</a>';
            html += '</div>';

            content.innerHTML = html;
        }

        async function loadResults() {
            const content = document.getElementById('content');
            try {
                const response = await fetch('/api/projects/' + projectId + '/results');
                if (!response.ok) {
                    throw new Error('Failed to load results');
                }
                const data = await response.json();
                countResponses(data);
                renderPage(data);
            } catch (error) {
                content.innerHTML = '<div class="error-state"><p>Something went wrong. Please try again.</p></div>';
            }
        }

        loadResults();
    </script>
</body>
</html>

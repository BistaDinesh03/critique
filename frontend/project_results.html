<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: none;
        }

        .page-title {
            margin-bottom: var(--space-5);
        }

        .page-title h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .question-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding: var(--space-4) var(--space-5);
            margin-bottom: var(--space-6);
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .question-text {
            font-weight: 600;
            font-size: var(--text-lg);
        }

        .total-badge {
            display: inline-block;
            background: var(--surface-muted);
            padding: var(--space-1) var(--space-4);
            border-radius: 999px;
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
            margin-bottom: var(--space-6);
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
        }

        .stat-card h3 {
            font-size: var(--text-base);
            font-weight: 700;
            margin-bottom: var(--space-4);
            color: var(--text-primary);
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .bar-label {
            min-width: 90px;
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .bar-track {
            flex: 1;
            height: 20px;
            background: var(--surface-muted);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width var(--transition-normal);
        }

        .bar-pct {
            min-width: 48px;
            text-align: right;
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .bar-fill.very_clear { background: var(--success); }
        .bar-fill.mostly_clear { background: var(--warning); }
        .bar-fill.confusing { background: var(--danger); }
        .bar-fill.yes { background: var(--success); }
        .bar-fill.maybe { background: var(--warning); }
        .bar-fill.no { background: var(--danger); }

        .written-responses {
            margin-top: var(--space-6);
        }

        .written-responses h3 {
            font-size: var(--text-lg);
            font-weight: 700;
            margin-bottom: var(--space-4);
        }

        .response-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .response-meta {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .response-suggestion {
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/">Submit</a>
        </nav>
    </header>

    <main class="container-wide">
        <a href="/discover" class="back-link">Back to discover</a>
        <div id="content">
            <div class="loading-state"><div class="loading-spinner"></div><p>Loading results...</p></div>
        </div>
    </main>

    <script>
        const projectId = window.location.pathname.split('/')[2];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clarityLabel(value) {
            const labels = { 'very_clear': 'Very clear', 'mostly_clear': 'Mostly clear', 'confusing': 'Confusing' };
            return labels[value] || value;
        }

        function wouldUseLabel(value) {
            const labels = { 'yes': 'Yes', 'maybe': 'Maybe', 'no': 'No' };
            return labels[value] || value;
        }

        function renderBar(label, value, cssClass) {
            return '<div class="bar-row">' +
                '<span class="bar-label">' + label + '</span>' +
                '<div class="bar-track"><div class="bar-fill ' + cssClass + '" style="width: ' + value + '%"></div></div>' +
                '<span class="bar-pct">' + value + '%</span>' +
                '</div>';
        }

        function renderStats(stats) {
            let html = '<span class="total-badge">' + stats.total + ' total response' + (stats.total !== 1 ? 's' : '') + '</span>';
            html += '<div class="stats-grid">';
            html += '<div class="stat-card"><h3>How clear is it?</h3>';
            html += renderBar('Very clear', stats.clarity.very_clear, 'very_clear');
            html += renderBar('Mostly clear', stats.clarity.mostly_clear, 'mostly_clear');
            html += renderBar('Confusing', stats.clarity.confusing, 'confusing');
            html += '</div>';
            html += '<div class="stat-card"><h3>Would you use it?</h3>';
            html += renderBar('Yes', stats.would_use.yes, 'yes');
            html += renderBar('Maybe', stats.would_use.maybe, 'maybe');
            html += renderBar('No', stats.would_use.no, 'no');
            html += '</div>';
            html += '</div>';
            return html;
        }

        function renderWrittenResponses(responses) {
            const withSuggestions = responses.filter(function(r) { return r.suggestion; });
            if (withSuggestions.length === 0) return '';

            let html = '<div class="written-responses"><h3>Written responses</h3>';
            withSuggestions.forEach(function(r) {
                html += '<div class="response-card">';
                html += '<div class="response-meta">';
                html += '<span>Clarity: ' + clarityLabel(r.clarity) + '</span>';
                html += '<span>Would use: ' + wouldUseLabel(r.would_use) + '</span>';
                html += '</div>';
                html += '<p class="response-suggestion">' + escapeHtml(r.suggestion) + '</p>';
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        async function loadResults() {
            const content = document.getElementById('content');
            try {
                const response = await fetch('/api/projects/' + projectId + '/results');
                if (!response.ok) {
                    throw new Error('Failed to load results');
                }
                const data = await response.json();

                let html = '<div class="page-title"><h2>' + escapeHtml(data.project_title) + ' — Results</h2></div>';

                if (data.question_text) {
                    html += '<div class="question-box">';
                    html += '<div class="question-label">The Question</div>';
                    html += '<div class="question-text">' + escapeHtml(data.question_text) + '</div>';
                    html += '</div>';
                }

                if (data.stats.total === 0) {
                    html += '<div class="empty-state"><h3>No responses yet</h3><p>Share your project to get feedback!</p></div>';
                } else {
                    html += renderStats(data.stats);
                    if (data.is_owner) { html += renderWrittenResponses(data.responses); }
                }

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = '<div class="error-state"><p>Something went wrong. Please try again.</p></div>';
            }
        }

        loadResults();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .page-title {
            margin-bottom: var(--space-6);
            text-align: center;
        }

        .page-title h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .page-title p {
            color: var(--text-muted);
            font-size: var(--text-base);
            margin-bottom: var(--space-1);
        }

        .page-title .subtitle {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-4);
            max-width: 1100px;
            margin: 0 auto;
        }

        @media (max-width: 1099px) {
            .project-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 699px) {
            .project-list {
                grid-template-columns: 1fr;
            }
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .project-card:hover,
        .project-card:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .project-screenshot {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: var(--surface-muted);
        }

        .project-card-body {
            padding: var(--space-4);
        }

        .project-title {
            font-size: var(--text-xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .project-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .question-box {
            background: var(--surface-muted);
            border-left: 3px solid var(--accent);
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-4);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-1);
        }

        .question-text {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .response-count {
            font-size: var(--text-sm);
            color: var(--text-muted);
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-4);
            margin-top: var(--space-6);
        }

        .pagination button {
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 600;
            background: var(--surface);
            color: var(--text-primary);
            transition: background-color var(--transition-fast);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--surface-muted);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .project-list {
                gap: var(--space-4);
            }

            .project-card-body {
                padding: var(--space-4);
            }

            .card-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .card-footer .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover" aria-current="page">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/#submit" class="btn-nav">Submit a project</a>
            <a href="/auth/login" class="btn-nav" id="login-btn" aria-label="Login with GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn" style="display:none;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h2v7H6zM2.5 2.5l1.4 1.4A5 5 0 1 0 8 3V1a7 7 0 1 1-5.5 1.5z"/></svg>  Logout</a>
        </nav>
    </header>

    <main class="container-wide">
        <div class="page-title">
            <h2>Discover</h2>
            <p>Help someone improve something they've built.</p>
            <p class="subtitle">Browse projects from makers looking for honest feedback.</p>
        </div>
        <div id="project-list" class="project-list" role="list" aria-label="Projects asking for feedback"></div>
        <nav class="pagination" id="pagination" style="display: none;" aria-label="Pagination">
            <button id="prev-btn" onclick="changePage(-1)" aria-label="Previous page">Previous</button>
            <span class="page-info" id="page-info" aria-live="polite"></span>
            <button id="next-btn" onclick="changePage(1)" aria-label="Next page">Next</button>
        </nav>
    </main>

    <script>
        let currentPage = 1;
        const pageSize = 9;
        let totalPages = 1;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading() {
            document.getElementById('project-list').innerHTML = '<div class="loading-state" role="status"><div class="loading-spinner"></div><p>Loading projects...</p></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showEmpty() {
            document.getElementById('project-list').innerHTML = '<div class="empty-state" role="status"><h3>No projects waiting for feedback yet</h3><p>Be the first maker to ask a question.</p><a href="/" class="btn btn-primary">Submit a project</a></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showError() {
            document.getElementById('project-list').innerHTML = '<div class="error-state" role="alert"><p>Couldn\'t load projects.</p><button onclick="loadProjects(currentPage)" class="btn btn-secondary" style="margin-top:var(--space-3);">Try again</button></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showProjects(items) {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';
            items.forEach(function(project) {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.setAttribute('role', 'listitem');
                const description = project.description || 'No description provided.';
                const questionText = project.question_text || 'No question';
                const responseCount = project.response_count || 0;
                const plural = responseCount !== 1 ? 's' : '';
                const screenshotHtml = project.image_url ? '<img class="project-screenshot" src="' + escapeHtml(project.image_url) + '" alt="Screenshot of ' + escapeHtml(project.title) + '" loading="lazy" onerror="this.style.display=\'none\'">' : '';
                card.innerHTML = screenshotHtml +
                    '<div class="project-card-body">' +
                    '<h3 class="project-title">' + escapeHtml(project.title) + '</h3>' +
                    '<p class="project-description">' + escapeHtml(description) + '</p>' +
                    '<div class="question-box"><div class="question-label">The Question</div><div class="question-text">' + escapeHtml(questionText) + '</div></div>' +
                    '<div class="card-footer"><span class="response-count">' + responseCount + ' response' + plural + '</span>' +
                    '<a href="/project/' + project.id + '" class="btn btn-primary" aria-label="View and respond to ' + escapeHtml(project.title) + '">View &amp; Respond</a></div>' +
                    '</div>';
                listContainer.appendChild(card);
            });
            if (totalPages > 1) {
                document.getElementById('pagination').style.display = 'flex';
                document.getElementById('prev-btn').disabled = currentPage <= 1;
                document.getElementById('next-btn').disabled = currentPage >= totalPages;
                document.getElementById('page-info').textContent = 'Page ' + currentPage + ' of ' + totalPages;
            }
        }

        async function fetchWithRetry(url, options, maxRetries) {
    maxRetries = maxRetries || 3;
    let lastError;
    for (let i = 0; i < maxRetries; i++) {
        try {
            const response = await fetch(url, options);
            if (response.status === 503 || response.status === 500) {
                throw new Error('Server waking up');
            }
            return response;
        } catch (e) {
            lastError = e;
            if (i < maxRetries - 1) {
                const delay = Math.min(1000 * Math.pow(2, i), 4000);
                await new Promise(function(resolve) { setTimeout(resolve, delay); });
            }
        }
    }
    throw lastError;
}

async function loadProjects(page) {
            currentPage = page;
            showLoading();
            try {
                const response = await fetchWithRetry('/api/projects/?page=' + page + '&page_size=' + pageSize);
                if (!response.ok) { throw new Error('Failed to load projects'); }
                const data = await response.json();
                totalPages = data.total_pages;
                if (data.items.length === 0) { showEmpty(); } else { showProjects(data.items); }
            } catch (error) {
                console.error('Error loading projects:', error);
                showError();
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) { loadProjects(newPage); }
        }

        loadProjects(1);
    
        async function checkAuth() {
            try {
                const response = await fetch('/auth/check', { credentials: 'same-origin' });
                if (response.status === 200) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                } else {
                    document.getElementById('login-btn').style.display = 'inline';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('login-btn').style.display = 'inline';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

            try { checkAuth(); } catch(e) {}
    </script>
    <script src="/static/ui.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .page-title {
            margin-bottom: var(--space-6);
            text-align: center;
        }

        .page-title h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .page-title p {
            color: var(--text-muted);
            font-size: var(--text-base);
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .project-card:hover,
        .project-card:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .project-title {
            font-size: var(--text-lg);
            font-weight: 700;
            margin-bottom: var(--space-2);
            color: var(--text-primary);
        }

        .project-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
        }

        .question-box {
            background: var(--surface-muted);
            border-left: 3px solid var(--accent);
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-4);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-1);
        }

        .question-text {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--text-base);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .response-count {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-4);
            margin-top: var(--space-6);
        }

        .pagination button {
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 600;
            background: var(--surface);
            color: var(--text-primary);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--surface-muted);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .card-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover" aria-current="page">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/">Submit</a>
        </nav>
    </header>

    <main class="container-wide">
        <div class="page-title">
            <h2>Discover</h2>
            <p>Help someone improve something they've built.</p>
        </div>
        <div id="project-list" class="project-list" role="list" aria-label="Projects asking for feedback"></div>
        <nav class="pagination" id="pagination" style="display: none;" aria-label="Pagination">
            <button id="prev-btn" onclick="changePage(-1)" aria-label="Previous page">Previous</button>
            <span class="page-info" id="page-info" aria-live="polite"></span>
            <button id="next-btn" onclick="changePage(1)" aria-label="Next page">Next</button>
        </nav>
    </main>

    <script>
        let currentPage = 1;
        const pageSize = 10;
        let totalPages = 1;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading() {
            document.getElementById('project-list').innerHTML = '<div class="loading-state" role="status"><div class="loading-spinner"></div><p>Loading projects...</p></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showEmpty() {
            document.getElementById('project-list').innerHTML = '<div class="empty-state" role="status"><h3>No projects yet</h3><p>Be the first to ask for feedback.</p><a href="/" class="btn btn-primary">Submit a project</a></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showError() {
            document.getElementById('project-list').innerHTML = '<div class="error-state" role="alert"><p>Something went wrong. Please try again.</p><button onclick="loadProjects(currentPage)" class="btn btn-secondary" style="margin-top:var(--space-3);">Try again</button></div>';
            document.getElementById('pagination').style.display = 'none';
        }

        function showProjects(items) {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';
            items.forEach(function(project) {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.setAttribute('role', 'listitem');
                const description = project.description || 'No description provided.';
                const questionText = project.question_text || 'No question';
                const responseCount = project.response_count || 0;
                const plural = responseCount !== 1 ? 's' : '';
                card.innerHTML = '<div class="project-title">' + escapeHtml(project.title) + '</div>' +
                    '<div class="project-description">' + escapeHtml(description) + '</div>' +
                    '<div class="question-box"><div class="question-label">The Question</div><div class="question-text">' + escapeHtml(questionText) + '</div></div>' +
                    '<div class="card-footer"><span class="response-count">' + responseCount + ' response' + plural + '</span>' +
                    '<a href="/project/' + project.id + '" class="btn btn-primary" aria-label="View and respond to ' + escapeHtml(project.title) + '">View and Respond</a></div>';
                listContainer.appendChild(card);
            });
            if (totalPages > 1) {
                document.getElementById('pagination').style.display = 'flex';
                document.getElementById('prev-btn').disabled = currentPage <= 1;
                document.getElementById('next-btn').disabled = currentPage >= totalPages;
                document.getElementById('page-info').textContent = 'Page ' + currentPage + ' of ' + totalPages;
            }
        }

        async function loadProjects(page) {
            currentPage = page;
            showLoading();
            try {
                const response = await fetch('/api/projects/?page=' + page + '&page_size=' + pageSize);
                if (!response.ok) { throw new Error('Failed to load projects'); }
                const data = await response.json();
                totalPages = data.total_pages;
                if (data.items.length === 0) { showEmpty(); } else { showProjects(data.items); }
            } catch (error) {
                console.error('Error loading projects:', error);
                showError();
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) { loadProjects(newPage); }
        }

        loadProjects(1);
    </script>
</body>
</html>

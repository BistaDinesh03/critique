<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: none;
        }

        .project-screenshot { width: 100%; border-radius: var(--radius-lg); margin-bottom: var(--space-4); object-fit: cover; max-height: 300px; }

        .project-header {
            margin-bottom: var(--space-5);
        }

        .project-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            letter-spacing: -0.01em;
        }

        /* Placeholder shell shown before /api/projects/{id} responds, so the
           page reads as a project page instead of an empty screen. */
        .skeleton-detail-title {
            display: block;
            width: 55%;
            max-width: 420px;
            height: 30px;
            margin-bottom: var(--space-5);
        }

        .skeleton-detail-block {
            margin-bottom: var(--space-5);
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            font-size: var(--text-base);
        }

        /* What is being reviewed, stated before anything is asked of the
           visitor. Kept to the builder's own words: no summary, no truncation. */
        .project-summary {
            color: var(--text-secondary);
            font-size: var(--text-base);
            line-height: 1.55;
            margin-bottom: var(--space-4);
        }

        .project-url {
            color: var(--accent);
            font-size: var(--text-sm);
            text-decoration: none;
            word-break: break-all;
        }

        .project-url:hover {
            text-decoration: underline;
        }

        .question-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .question-text {
            font-weight: 600;
            font-size: var(--text-lg);
            color: var(--text-primary);
        }

        .response-form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-top: var(--space-5);
        }

        /* A finished feedback area states what happened; it never borrows the
           red error treatment, because nothing went wrong. */
        .response-done {
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-left: 3px solid var(--success);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: var(--space-4) var(--space-5);
            margin-top: var(--space-3);
            font-size: var(--text-sm);
        }

        .response-done p {
            margin-bottom: var(--space-2);
        }

        .response-done p:last-child {
            margin-bottom: 0;
        }

        .response-done-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .response-done-note {
            color: var(--text-secondary);
        }

        .response-done a {
            display: inline-block;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }

        .response-done a:hover {
            text-decoration: underline;
        }

        .form-section {
            margin-bottom: var(--space-5);
        }

        .form-section h3 {
            font-size: var(--text-base);
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .radio-group {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
            font-size: var(--text-sm);
            font-weight: 500;
        }

        .radio-option:hover {
            border-color: var(--accent);
            background: var(--surface-muted);
        }

        .radio-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.04);
            font-weight: 600;
        }

        .radio-option input[type="radio"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .radio-option label {
            cursor: pointer;
        }

        .responses-list {
            margin-top: var(--space-6);
        }

        .responses-list h3 {
            font-size: var(--text-lg);
            font-weight: 700;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .response-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .response-meta {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .response-suggestion {
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        @media (max-width: 600px) {
            .radio-group {
                flex-direction: column;
            }

            .radio-option {
                justify-content: center;
            }

            /* On a phone the form is the screen: same fields, less chrome. */
            .response-form-card {
                padding: var(--space-4);
                margin-top: var(--space-4);
            }

            .form-section {
                margin-bottom: var(--space-4);
            }

            .question-block {
                padding: var(--space-4);
                margin-bottom: var(--space-4);
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <button type="button" class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navbar-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <nav class="navbar-nav" id="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/#submit" class="btn-nav">Submit a project</a>
            <a href="/auth/login" class="btn-nav" id="login-btn" aria-label="Login with GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg> Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
        </nav>
    </header>

    <main class="container">
        <a href="/discover" class="back-link">Back to discover</a>
        <div id="content" aria-busy="true">
            <div role="status">
                <p class="sr-only">Loading project...</p>
                <div aria-hidden="true">
                    <div class="skeleton skeleton-detail-title"></div>
                    <div class="skeleton-card skeleton-detail-block">
                        <div class="skeleton-body">
                            <div class="skeleton skeleton-line w-50"></div>
                            <div class="skeleton skeleton-line w-100"></div>
                        </div>
                    </div>
                    <div class="skeleton-card skeleton-detail-block">
                        <div class="skeleton-body">
                            <div class="skeleton skeleton-line w-75"></div>
                            <div class="skeleton skeleton-line w-100"></div>
                            <div class="skeleton skeleton-line w-100"></div>
                            <div class="skeleton skeleton-line w-50"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const projectId = window.location.pathname.split('/')[2];

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        // Attribute-safe HTML escaping: &, <, >, " and ' are all escaped so a
        // user-controlled value can never break out of a quoted HTML attribute.
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function clarityLabel(v) { return {'very_clear':'Very clear','mostly_clear':'Mostly clear','confusing':'Confusing'}[v] || v; }
        function wouldUseLabel(v) { return {'yes':'Yes','maybe':'Maybe','no':'No'}[v] || v; }

        function getCurrentUserId() {
            return localStorage.getItem('user_id') || '';
        }

        async function loadProject() {
            const content = document.getElementById('content');
            try {
                const [projectRes, responsesRes] = await Promise.all([
                    fetch('/api/projects/' + projectId),
                    fetch('/api/projects/' + projectId + '/responses')
                ]);
                if (!projectRes.ok) throw new Error('Project not found');
                const projectData = await projectRes.json();
                const responses = responsesRes.ok ? await responsesRes.json() : [];
                renderProject(projectData, responses);
            } catch (e) {
                // The placeholder is never the end state: a real message plus a
                // way to try again if the backend is slow or unreachable.
                content.innerHTML = '';
                const box = document.createElement('div');
                box.className = 'error-state';
                box.setAttribute('role', 'alert');
                box.innerHTML = '<p>Something went wrong. Please try again.</p>';
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'btn btn-secondary';
                retry.style.marginTop = 'var(--space-3)';
                retry.textContent = 'Try again';
                retry.addEventListener('click', function() {
                    content.innerHTML = '<div class="loading-state" role="status"><p>Loading project...</p></div>';
                    content.setAttribute('aria-busy', 'true');
                    loadProject();
                });
                box.appendChild(retry);
                content.appendChild(box);
            } finally {
                content.setAttribute('aria-busy', 'false');
            }
        }

        let feedbackStartTracked = false;
        let feedbackFormViewedTracked = false;

        function renderProject(data, responses) {
            feedbackStartTracked = false;
            const content = document.getElementById('content');
            const p = data.project;
            const q = data.question;
            let html = '';
            html += '<h2 class="project-title">' + escapeHtml(p.title) + '</h2>';
            // What is being reviewed is stated before anything is asked of the
            // visitor, so the answer is given with the context in view.
            if (p.description) { html += '<p class="project-summary">' + escapeHtml(p.description) + '</p>'; }
            if (q) {
                html += '<div class="question-block"><div class="question-label">The Maker\'s Question</div><div class="question-text">' + escapeHtml(q.text) + '</div></div>';
                html += '<div class="eyebrow">Your feedback</div>';
                if (feedbackAlreadySubmitted()) {
                    // This session already answered: offering the form again
                    // would only earn a 409 from the server, so show the
                    // recorded state and its next step instead.
                    html += '<div class="response-form-card"><div id="feedback-thanks" role="status"></div></div>';
                } else {
                    // Three short, numbered steps: the form reads as a task
                    // with an end rather than an open-ended questionnaire.
                    html += '<div class="response-form-card"><form id="response-form">';
                    html += '<div class="form-section"><h3>1. How clear is it?</h3><div class="radio-cards">';
                    html += '<label class="radio-card"><input type="radio" id="c1" name="clarity" value="very_clear" required onclick="trackFeedbackStart()"><span class="radio-card-label"><span class="radio-card-title">Very clear</span><span class="radio-card-desc">I understood the project quickly.</span></span></label>';
                    html += '<label class="radio-card"><input type="radio" id="c2" name="clarity" value="mostly_clear" onclick="trackFeedbackStart()"><span class="radio-card-label"><span class="radio-card-title">Mostly clear</span><span class="radio-card-desc">I understood it, but needed some explanation.</span></span></label>';
                    html += '<label class="radio-card"><input type="radio" id="c3" name="clarity" value="confusing" onclick="trackFeedbackStart()"><span class="radio-card-label"><span class="radio-card-title">Confusing</span><span class="radio-card-desc">I was not sure what it does.</span></span></label>';
                    html += '</div></div>';
                    html += '<div class="form-section"><h3>2. Would you use it?</h3><div class="radio-cards">';
                    html += '<label class="radio-card"><input type="radio" id="u1" name="would_use" value="yes" required><span class="radio-card-label"><span class="radio-card-title">Yes</span><span class="radio-card-desc">I would use this.</span></span></label>';
                    html += '<label class="radio-card"><input type="radio" id="u2" name="would_use" value="maybe"><span class="radio-card-label"><span class="radio-card-title">Maybe</span><span class="radio-card-desc">I might use this in some cases.</span></span></label>';
                    html += '<label class="radio-card"><input type="radio" id="u3" name="would_use" value="no"><span class="radio-card-label"><span class="radio-card-title">No</span><span class="radio-card-desc">I would not use this.</span></span></label>';
                    html += '</div></div>';
                    html += '<div class="form-section"><h3>3. What would you change? <span style="font-weight:400;color:var(--text-muted);">(optional)</span></h3><textarea class="form-textarea" id="suggestion" maxlength="2000" placeholder="Your honest feedback..."></textarea></div>';
                    html += '<button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Submit feedback</button>';
                    html += '<div class="message" id="message"></div></form></div>';
                }
                var details = '';
                if (p.image_url) { details += '<img class="project-screenshot" src="' + escapeHtml(p.image_url) + '" alt="Screenshot of ' + escapeHtml(p.title) + '" loading="lazy" onerror="this.style.display=\'none\'">'; }
                if (p.url) { details += '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener" class="project-url">' + escapeHtml(p.url) + '</a>'; }
                if (details) { html += '<div class="eyebrow">About this project</div><div class="project-header" style="margin-top: var(--space-5);">' + details + '</div>'; }
                if (responses.length > 0) {
                    html += '<div class="eyebrow">Responses</div>';
                    html += '<div class="responses-list"><h3>' + responses.length + ' response' + (responses.length !== 1 ? 's' : '') + '</h3>';
                    responses.forEach(function(r) {
                        html += '<div class="response-item"><div class="response-meta"><span>Clarity: ' + clarityLabel(r.clarity) + '</span><span>Would use: ' + wouldUseLabel(r.would_use) + '</span></div>';
                        if (r.suggestion) html += '<p class="response-suggestion">' + escapeHtml(r.suggestion) + '</p>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
            }
            content.innerHTML = html;
            const form = document.getElementById('response-form');
            if (form) form.addEventListener('submit', handleSubmit);
            if (form && !feedbackFormViewedTracked) { feedbackFormViewedTracked = true; window.CritiqueAnalytics.trackEvent('feedback_form_viewed', projectId); }
            if (feedbackAlreadySubmitted()) {
                showFeedbackSuccessNextStep(document.getElementById('feedback-thanks'));
            }
            // Restore any saved feedback draft from before OAuth
            maybeRestoreAfterLogin();
            maybeResumeToFeedback();
        }

        function trackFeedbackStart() {
            if (feedbackStartTracked) return;
            feedbackStartTracked = true;
            window.CritiqueAnalytics.trackEvent('feedback_start', projectId);
        }

        // ===== Feedback form state persistence =====
        function feedbackStorageKey() {
            return 'critique_feedback_' + projectId;
        }

        function saveFeedbackDraft() {
            try {
                var clarityEl = document.querySelector('input[name="clarity"]:checked');
                var wouldEl = document.querySelector('input[name="would_use"]:checked');
                var suggestionEl = document.getElementById('suggestion');
                var draft = {
                    clarity: clarityEl ? clarityEl.value : null,
                    would_use: wouldEl ? wouldEl.value : null,
                    suggestion: suggestionEl ? suggestionEl.value : ''
                };
                sessionStorage.setItem(feedbackStorageKey(), JSON.stringify(draft));
            } catch (e) {}
        }

        function restoreFeedbackDraft() {
            try {
                var raw = sessionStorage.getItem(feedbackStorageKey());
                if (!raw) return false;
                var draft = JSON.parse(raw);
                if (!draft || typeof draft !== 'object') return false;
                if (draft.clarity) {
                    var c = document.querySelector('input[name="clarity"][value="' + draft.clarity + '"]');
                    if (c) c.checked = true;
                }
                if (draft.would_use) {
                    var w = document.querySelector('input[name="would_use"][value="' + draft.would_use + '"]');
                    if (w) w.checked = true;
                }
                if (draft.suggestion) {
                    var s = document.getElementById('suggestion');
                    if (s) s.value = draft.suggestion;
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        // ===== Email-flow draft fallback (localStorage, 60-minute TTL) =====
        // Only written when the user explicitly chooses the email auth path.
        // Only read when returning from an email verification. Never used
        // for the GitHub flow. Never server-side. Never cross-device.
        function emailFallbackKey() {
            return 'critique_feedback_' + projectId + '_email_fallback';
        }

        function saveEmailFallbackDraft() {
            try {
                var clarityEl = document.querySelector('input[name="clarity"]:checked');
                var wouldEl = document.querySelector('input[name="would_use"]:checked');
                var suggestionEl = document.getElementById('suggestion');
                var draft = {
                    projectId: parseInt(projectId, 10),
                    clarity: clarityEl ? clarityEl.value : null,
                    would_use: wouldEl ? wouldEl.value : null,
                    suggestion: suggestionEl ? suggestionEl.value : '',
                    createdAt: Date.now()
                };
                localStorage.setItem(emailFallbackKey(), JSON.stringify(draft));
            } catch (e) {}
        }

        function readEmailFallbackDraft() {
            try {
                var raw = localStorage.getItem(emailFallbackKey());
                if (!raw) return null;
                var draft = JSON.parse(raw);
                if (!draft || typeof draft !== 'object') return null;
                if (parseInt(draft.projectId, 10) !== parseInt(projectId, 10)) return null;
                if (typeof draft.createdAt !== 'number') return null;
                if (Date.now() - draft.createdAt > 60 * 60 * 1000) return null;
                return draft;
            } catch (e) {
                return null;
            }
        }

        function clearEmailFallbackDraft() {
            try {
                localStorage.removeItem(emailFallbackKey());
            } catch (e) {}
        }
        function clearFeedbackDraft() {
            try {
                sessionStorage.removeItem(feedbackStorageKey());
            } catch (e) {}
        }

        // ===== After a successful submit =====
        // The session now knows this project has been answered: a reload must
        // not offer the form again (the server would only answer 409), and the
        // next step stays reachable instead of vanishing with a page refresh.
        function feedbackSubmittedKey() {
            return 'critique_responded_' + projectId;
        }

        function markFeedbackSubmitted() {
            try {
                sessionStorage.setItem(feedbackSubmittedKey(), '1');
            } catch (e) {}
        }

        function feedbackAlreadySubmitted() {
            try {
                return sessionStorage.getItem(feedbackSubmittedKey()) === '1';
            } catch (e) {
                return false;
            }
        }

        function disableResponseForm() {
            var form = document.getElementById('response-form');
            if (!form) return;
            var controls = form.querySelectorAll('input, textarea, button');
            for (var i = 0; i < controls.length; i++) {
                controls[i].disabled = true;
            }
        }

        // Both states after feedback end the same way: one link to the next
        // real project waiting for an answer. It starts at the real project
        // list and is upgraded as soon as the feed answers -- no invented
        // content, and a fetch failure simply leaves the honest fallback.
        function attachNextProjectLink(link) {
            if (!link) return;
            link.href = '/discover';
            fetch('/api/projects/?page=1&page_size=6')
                .then(function(res) {
                    return res.ok ? res.json() : null;
                })
                .then(function(data) {
                    var items = (data && data.items) || [];
                    var own = parseInt(projectId, 10);
                    for (var i = 0; i < items.length; i++) {
                        var id = parseInt(items[i] && items[i].id, 10);
                        if (!isNaN(id) && id !== own) {
                            link.href = '/project/' + id;
                            return;
                        }
                    }
                })
                .catch(function() {});
        }

        function showFeedbackSuccessNextStep(container) {
            if (!container) return;
            container.className = 'alert alert-success';
            container.setAttribute('role', 'status');
            container.textContent = 'Thank you! Your feedback has been submitted. ';
            var link = document.createElement('a');
            link.id = 'help-another-builder';
            link.textContent = 'Help another builder \u2192';
            container.appendChild(link);
            attachNextProjectLink(link);
        }

        // The server already holds a response from this person (a second
        // device, a cleared session). That is a finished state, not a
        // failure: no red error, no live submit button, and a way onward.
        function showAlreadyRespondedState(container) {
            if (!container) return;
            container.className = 'response-done';
            container.setAttribute('role', 'status');
            container.innerHTML = '';
            var title = document.createElement('p');
            title.className = 'response-done-title';
            title.textContent = '\u2713 You already gave feedback on this project.';
            container.appendChild(title);
            var note = document.createElement('p');
            note.className = 'response-done-note';
            note.textContent = 'Thanks for helping this builder.';
            container.appendChild(note);
            var link = document.createElement('a');
            link.id = 'explore-another-project';
            link.textContent = 'Explore another project \u2192';
            container.appendChild(link);
            attachNextProjectLink(link);
        }

        // ===== Safe return_to helper =====
        function currentPathForReturn() {
            return window.location.pathname;
        }

        // Shared auth choice for the feedback gate: GitHub primary, email
        // secondary, both with the same resume/draft behaviour. The wording
        // matters here -- this is the middle of a submission the visitor
        // already started, not a wall in front of one.
        function feedbackAuthConfig(message) {
            return {
                title: 'Your feedback is ready.',
                message: message || 'One quick step: sign in so we can send it to the builder.',
                returnTo: currentPathForReturn() + '?resume=feedback',
                context: projectId,
                notes: ['Your feedback is saved.', 'No password required.'],
                emailSentHint: 'Click the link in the email to finish submitting your feedback.',
                onStart: function(method) {
                    saveFeedbackDraft();
                    if (method === 'email') saveEmailFallbackDraft();
                }
            };
        }

        function showInlineLoginPrompt(msg, message) {
            msg = msg || document.getElementById('message');
            if (!msg) return;
            // An anonymous visitor cannot get past this point, so the button
            // that would only ever answer 401 stops pretending otherwise. The
            // answers themselves stay editable.
            var submit = document.getElementById('submit-btn');
            if (submit) submit.disabled = true;
            // The prompt is re-rendered whenever the gate appears again (the
            // submit handler clears #message first), but the analytics event
            // fires only once per page.
            if (msg.dataset.promptShown !== 'true') {
                msg.dataset.promptShown = 'true';
                window.CritiqueAnalytics.trackEvent('login_prompt_shown', projectId);
            }
            CritiqueUI.renderAuthChoice(msg, feedbackAuthConfig(message));
        }
        // The GitHub / email choice, the email form and the "check your email"
        // confirmation all come from CritiqueUI (static/ui.js) so this page and
        // every other login gate behave identically.

        // Detect return from OAuth: if any draft was saved, restore it and
        // record the sign-in that made it possible.
        function returnedFromAuth() {
            // Both sign-in routes hand the page back with this flag (it is the
            // return_to the gate itself builds), and it is cleared on the first
            // load -- so it marks an actual authentication return, where a
            // draft on the page alone does not.
            return window.location.search.indexOf('resume=feedback') !== -1;
        }

        function maybeResumeToFeedback() {
            // If we returned from OAuth with ?resume=feedback, scroll to the feedback form
            if (!returnedFromAuth()) return;
            var form = document.getElementById('response-form');
            if (!form) return;
            setTimeout(function() {
                form.scrollIntoView({ behavior: 'smooth', block: 'start' });
                var firstRadio = form.querySelector('input[name="clarity"]');
                if (firstRadio) {
                    setTimeout(function() { firstRadio.focus({ preventScroll: true }); }, 400);
                }
            }, 200);
            // Clean the URL so refreshing doesn't re-trigger
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, '', window.location.pathname);
            }
            // Fire feedback_resume only if a draft was actually restored
            try {
                var raw = sessionStorage.getItem(feedbackStorageKey());
                if (raw) {
                    window.CritiqueAnalytics.trackEvent('feedback_resume', projectId);
                }
            } catch (e) {}

            // ...and then finish what the visitor already asked to send.
            continueFeedbackAfterLogin();
        }

        // A complete draft that came back from the sign-in step is submitted
        // right away: the visitor pressed "Submit feedback" once already, and
        // the sign-in was the only thing that stopped it. An incomplete draft
        // is never sent -- it is left in the form for its author to finish.
        var resumeContinued = false;
        function continueFeedbackAfterLogin() {
            if (resumeContinued) return false;
            var draft = null;
            try {
                var raw = sessionStorage.getItem(feedbackStorageKey());
                draft = raw ? JSON.parse(raw) : null;
            } catch (e) {
                draft = null;
            }
            if (!draft || typeof draft !== 'object') return false;
            if (!draft.clarity || !draft.would_use) return false;
            var form = document.getElementById('response-form');
            if (!form) return false;
            // Only send once the form really holds both answers.
            if (!document.querySelector('input[name="clarity"]:checked') ||
                !document.querySelector('input[name="would_use"]:checked')) return false;
            resumeContinued = true;
            if (typeof form.requestSubmit === 'function') {
                form.requestSubmit();
            } else {
                // Environments without form.requestSubmit still continue the
                // submission instead of leaving the visitor at a dead end.
                handleSubmit({ preventDefault: function() {} });
            }
            return true;
        }

        // The draft is restored on every load -- that is what a draft is for.
        // The *sign-in events* are not: they fire only when the page was
        // actually returned by an authentication, because "a draft exists"
        // used to be enough and every refresh with a half-written answer was
        // counted as a new sign-in.
        function maybeRestoreAfterLogin() {
            try {
                var raw = sessionStorage.getItem(feedbackStorageKey());
                if (raw) {
                    // sessionStorage takes priority. Same-tab return from GitHub OAuth.
                    if (restoreFeedbackDraft() && returnedFromAuth()) {
                        window.CritiqueAnalytics.trackEvent('login_success', projectId);
                    }
                    return;
                }

                // Fallback: email verification in a new tab on the same device.
                var fallback = readEmailFallbackDraft();
                if (fallback) {
                    var draft = {
                        clarity: fallback.clarity,
                        would_use: fallback.would_use,
                        suggestion: fallback.suggestion
                    };
                    sessionStorage.setItem(feedbackStorageKey(), JSON.stringify(draft));
                    if (restoreFeedbackDraft() && returnedFromAuth()) {
                        window.CritiqueAnalytics.trackEvent('email_verification_success', projectId);
                    }
                }
            } catch (e) {}
        }
        async function handleSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');
            msg.className = 'alert';
            msg.textContent = '';
            btn.disabled = true;
            // Set once the outcome is settled, so the finally block does not
            // hand the visitor a live submit button on a form that has been
            // recorded (finished) or is waiting for sign-in (gated).
            let finished = false;
            let gated = false;

            const csrfToken = getCsrfToken();
            const payload = {
                clarity: document.querySelector('input[name="clarity"]:checked').value,
                would_use: document.querySelector('input[name="would_use"]:checked').value,
                suggestion: document.getElementById('suggestion').value.trim() || null,
            };

            window.CritiqueAnalytics.trackEvent('feedback_submit_attempt', projectId);
            try {
                const response = await fetch('/api/projects/' + projectId + '/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify(payload),
                });
                let data = {};
                try {
                    data = await response.json();
                } catch (jsonError) {
                    data = {};
                }
                if (response.ok) {
                    window.CritiqueAnalytics.trackEvent('feedback_submit', projectId);
                    CritiqueUI.showToast('Feedback submitted', 'success');
                    clearFeedbackDraft();
                    clearEmailFallbackDraft();
                    // Keep the confirmation on screen instead of wiping it with
                    // a reload: the finished form is closed to double submits
                    // and the visitor gets the next step -- another real
                    // project that is also waiting for an answer.
                    finished = true;
                    markFeedbackSubmitted();
                    disableResponseForm();
                    showFeedbackSuccessNextStep(msg);
                } else if (response.status === 401) {
                    // The designed sign-in gate, not a failed submission: the
                    // draft is kept for after login and login_prompt_shown
                    // already records that the gate appeared. Reporting this as
                    // feedback_submit_error buried every real failure under the
                    // far larger number of anonymous attempts.
                    saveFeedbackDraft();
                    gated = true;
                    showInlineLoginPrompt(msg);
                } else if (response.status === 409) {
                    // The server already holds a response from this person
                    // (another device, a cleared session). The attempt created
                    // nothing, so it stays counted in feedback_submit_error --
                    // but the visitor has nothing to fix, so the screen is a
                    // completed state rather than a red error.
                    window.CritiqueAnalytics.trackEvent('feedback_submit_error', projectId);
                    finished = true;
                    markFeedbackSubmitted();
                    disableResponseForm();
                    const doneBtn = document.getElementById('submit-btn');
                    if (doneBtn) doneBtn.style.display = 'none';
                    showAlreadyRespondedState(msg);
                } else if (response.status === 403) {
                    window.CritiqueAnalytics.trackEvent('feedback_submit_error', projectId);
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Session expired. Please refresh.';
                } else {
                    window.CritiqueAnalytics.trackEvent('feedback_submit_error', projectId);
                    msg.className = 'alert alert-error';
                    msg.textContent = data.detail || 'Failed to submit.';
                }
            } catch (e) {
                window.CritiqueAnalytics.trackEvent('feedback_submit_error', projectId);
                console.error('Submit error:', e);
                msg.className = 'alert alert-error';
                msg.textContent = 'Network error: ' + e.message;
            } finally {
                if (!finished && !gated) btn.disabled = false;
            }
        }

        loadProject();
    
        async function checkAuth() {
            try {
                const response = await fetch('/auth/check', { credentials: 'same-origin' });
                if (response.status === 200) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                } else {
                    document.getElementById('login-btn').style.display = 'inline';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('login-btn').style.display = 'inline';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

            try { checkAuth(); } catch(e) {}
    </script>

    (function() {
        var toggle = document.getElementById('navbar-toggle');
        var nav = document.getElementById('navbar-nav');
        if (!toggle || !nav) return;

        toggle.addEventListener('click', function() {
            var isOpen = nav.classList.toggle('navbar-nav-open');
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });

        // Close menu when any link inside is clicked
        nav.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                nav.classList.remove('navbar-nav-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Close menu on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && nav.classList.contains('navbar-nav-open')) {
                nav.classList.remove('navbar-nav-open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.focus();
            }
        });
    })();

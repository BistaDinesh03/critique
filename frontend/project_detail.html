<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: none;
        }

        .project-screenshot { width: 100%; border-radius: var(--radius-lg); margin-bottom: var(--space-4); object-fit: cover; max-height: 300px; }

        .project-header {
            margin-bottom: var(--space-5);
        }

        .project-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            letter-spacing: -0.01em;
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            font-size: var(--text-base);
        }

        .project-url {
            color: var(--accent);
            font-size: var(--text-sm);
            text-decoration: none;
            word-break: break-all;
        }

        .project-url:hover {
            text-decoration: underline;
        }

        .question-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .question-text {
            font-weight: 600;
            font-size: var(--text-lg);
            color: var(--text-primary);
        }

        .response-form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
        }

        .form-section {
            margin-bottom: var(--space-5);
        }

        .form-section h3 {
            font-size: var(--text-base);
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .radio-group {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
            font-size: var(--text-sm);
            font-weight: 500;
        }

        .radio-option:hover {
            border-color: var(--accent);
            background: var(--surface-muted);
        }

        .radio-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.04);
            font-weight: 600;
        }

        .radio-option input[type="radio"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .radio-option label {
            cursor: pointer;
        }

        .responses-list {
            margin-top: var(--space-6);
        }

        .responses-list h3 {
            font-size: var(--text-base);
            font-weight: 700;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .response-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .response-meta {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .response-suggestion {
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        @media (max-width: 600px) {
            .radio-group {
                flex-direction: column;
            }

            .radio-option {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/#submit" class="btn-nav">Submit a project</a>
            <a href="/auth/login" class="btn-nav" id="login-btn" aria-label="Login with GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg> Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn" style="display:none;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
        </nav>
    </header>

    <main class="container">
        <a href="/discover" class="back-link">Back to discover</a>
        <div id="content"><div class="loading-state"><div class="loading-spinner"></div><p>Loading project...</p></div></div>
    </main>

    <script>
        const projectId = window.location.pathname.split('/')[2];

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clarityLabel(v) { return {'very_clear':'Very clear','mostly_clear':'Mostly clear','confusing':'Confusing'}[v] || v; }
        function wouldUseLabel(v) { return {'yes':'Yes','maybe':'Maybe','no':'No'}[v] || v; }

        function getCurrentUserId() {
            return localStorage.getItem('user_id') || '';
        }

        async function loadProject() {
            const content = document.getElementById('content');
            try {
                const [projectRes, responsesRes] = await Promise.all([
                    fetch('/api/projects/' + projectId),
                    fetch('/api/projects/' + projectId + '/responses', { headers: { 'X-Owner-ID': getCurrentUserId() } })
                ]);
                if (!projectRes.ok) throw new Error('Project not found');
                const projectData = await projectRes.json();
                const responses = responsesRes.ok ? await responsesRes.json() : [];
                renderProject(projectData, responses);
            } catch (e) {
                content.innerHTML = '<div class="error-state"><p>Something went wrong. Please try again.</p></div>';
            }
        }

        function renderProject(data, responses) {
            const content = document.getElementById('content');
            const p = data.project;
            const q = data.question;
            let html = '<div class="project-header">';
            if (p.image_url) { html += '<img class="project-screenshot" src="' + escapeHtml(p.image_url) + '" alt="Screenshot of ' + escapeHtml(p.title) + '" loading="lazy" onerror="this.style.display=\'none\'">'; }
            html += '<h2 class="project-title">' + escapeHtml(p.title) + '</h2>';
            if (p.description) html += '<p class="project-description">' + escapeHtml(p.description) + '</p>';
            if (p.url) html += '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener" class="project-url">' + escapeHtml(p.url) + '</a>';
            html += '</div>';
            if (q) {
                html += '<div class="question-block"><div class="question-label">The Maker\'s Question</div><div class="question-text">' + escapeHtml(q.text) + '</div></div>';
                html += '<div class="response-form-card"><form id="response-form">';
                html += '<div class="form-section"><h3>How clear is it?</h3><div class="radio-cards">';
                html += '<label class="radio-card"><input type="radio" id="c1" name="clarity" value="very_clear" required onclick="trackFeedbackStart()"><span class="radio-card-label"><span class="radio-card-title">Very clear</span><span class="radio-card-desc">I understood the project quickly.</span></span></label>';
                html += '<label class="radio-card"><input type="radio" id="c2" name="clarity" value="mostly_clear"><span class="radio-card-label"><span class="radio-card-title">Mostly clear</span><span class="radio-card-desc">I understood it, but needed some explanation.</span></span></label>';
                html += '<label class="radio-card"><input type="radio" id="c3" name="clarity" value="confusing"><span class="radio-card-label"><span class="radio-card-title">Confusing</span><span class="radio-card-desc">I was not sure what it does.</span></span></label>';
                html += '</div></div>';
                html += '<div class="form-section"><h3>Would you use it?</h3><div class="radio-cards">';
                html += '<label class="radio-card"><input type="radio" id="u1" name="would_use" value="yes" required><span class="radio-card-label"><span class="radio-card-title">Yes</span><span class="radio-card-desc">I would use this.</span></span></label>';
                html += '<label class="radio-card"><input type="radio" id="u2" name="would_use" value="maybe"><span class="radio-card-label"><span class="radio-card-title">Maybe</span><span class="radio-card-desc">I might use this in some cases.</span></span></label>';
                html += '<label class="radio-card"><input type="radio" id="u3" name="would_use" value="no"><span class="radio-card-label"><span class="radio-card-title">No</span><span class="radio-card-desc">I would not use this.</span></span></label>';
                html += '</div></div>';
                html += '<div class="form-section"><h3>What would you change? <span style="font-weight:400;color:var(--text-muted);">(optional)</span></h3><textarea class="form-textarea" id="suggestion" maxlength="2000" placeholder="Your honest feedback..."></textarea></div>';
                html += '<button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Submit feedback</button>';
                html += '<div class="message" id="message"></div></form></div>';
                if (responses.length > 0) {
                    html += '<div class="responses-list"><h3>' + responses.length + ' response' + (responses.length !== 1 ? 's' : '') + '</h3>';
                    responses.forEach(function(r) {
                        html += '<div class="response-item"><div class="response-meta"><span>Clarity: ' + clarityLabel(r.clarity) + '</span><span>Would use: ' + wouldUseLabel(r.would_use) + '</span></div>';
                        if (r.suggestion) html += '<p class="response-suggestion">' + escapeHtml(r.suggestion) + '</p>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
            }
            content.innerHTML = html;
            const form = document.getElementById('response-form');
            if (form) form.addEventListener('submit', handleSubmit);
        }

        function trackFeedbackStart() {
            window.CritiqueAnalytics.trackEvent('feedback_start', projectId);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');
            msg.className = 'alert';
            msg.textContent = '';
            btn.disabled = true;

            const csrfToken = getCsrfToken();
            const payload = {
                clarity: document.querySelector('input[name="clarity"]:checked').value,
                would_use: document.querySelector('input[name="would_use"]:checked').value,
                suggestion: document.getElementById('suggestion').value.trim() || null,
            };

            try {
                const response = await fetch('/api/projects/' + projectId + '/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify(payload),
                });
                let data = {};
                try {
                    data = await response.json();
                } catch (jsonError) {
                    data = {};
                }
                if (response.ok) {
                    window.CritiqueAnalytics.trackEvent('feedback_submit', projectId);
                    CritiqueUI.showToast('Feedback submitted', 'success');
                    msg.className = 'alert alert-success';
                    msg.textContent = 'Thank you! Your feedback has been submitted.';
                    document.getElementById('response-form').reset();
                    setTimeout(loadProject, 1500);
                } else if (response.status === 401) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Please login to submit feedback.';
                } else if (response.status === 403) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Session expired. Please refresh.';
                } else {
                    msg.className = 'alert alert-error';
                    msg.textContent = data.detail || 'Failed to submit.';
                }
            } catch (e) {
                console.error('Submit error:', e);
                msg.className = 'alert alert-error';
                msg.textContent = 'Network error: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        loadProject();
    
        async function checkAuth() {
            try {
                const response = await fetch('/auth/check', { credentials: 'same-origin' });
                if (response.status === 200) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                } else {
                    document.getElementById('login-btn').style.display = 'inline';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('login-btn').style.display = 'inline';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

            try { checkAuth(); } catch(e) {}
    </script>
    <script src="/static/ui.js"></script>
    <script src="/static/analytics.js"></script>
    <script>trackPageView();</script>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <h3>Critique</h3>
                <p>Ask one question. Get real answers.</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>Product</h4>
                    <ul>
                        <li><a href="/discover">Discover</a></li>
                        <li><a href="/#submit">Submit a project</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4>Connect</h4>
                    <ul>
                        <li><a href="https://github.com/BistaDinesh03/critique" target="_blank" rel="noopener">GitHub</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <span>© 2026 Critique · Open source · Free to use</span>
        </div>
    </footer>

</body>
</html>

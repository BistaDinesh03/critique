<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: none;
        }

        .project-header {
            margin-bottom: var(--space-5);
        }

        .project-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            letter-spacing: -0.01em;
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            font-size: var(--text-base);
        }

        .project-url {
            color: var(--accent);
            font-size: var(--text-sm);
            text-decoration: none;
            word-break: break-all;
        }

        .project-url:hover {
            text-decoration: underline;
        }

        .question-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        .question-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .question-text {
            font-weight: 600;
            font-size: var(--text-lg);
            color: var(--text-primary);
        }

        .response-form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
        }

        .form-section {
            margin-bottom: var(--space-5);
        }

        .form-section h3 {
            font-size: var(--text-base);
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .radio-group {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
            font-size: var(--text-sm);
            font-weight: 500;
        }

        .radio-option:hover {
            border-color: var(--accent);
            background: var(--surface-muted);
        }

        .radio-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.04);
            font-weight: 600;
        }

        .radio-option input[type="radio"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .radio-option label {
            cursor: pointer;
        }

        .responses-list {
            margin-top: var(--space-6);
        }

        .responses-list h3 {
            font-size: var(--text-base);
            font-weight: 700;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .response-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .response-meta {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .response-suggestion {
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        @media (max-width: 600px) {
            .radio-group {
                flex-direction: column;
            }

            .radio-option {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/">Submit</a>
        </nav>
    </header>

    <main class="container">
        <a href="/discover" class="back-link">Back to discover</a>
        <div id="content"><div class="loading-state"><div class="loading-spinner"></div><p>Loading project...</p></div></div>
    </main>

    <script>
        const projectId = window.location.pathname.split('/')[2];

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clarityLabel(v) { return {'very_clear':'Very clear','mostly_clear':'Mostly clear','confusing':'Confusing'}[v] || v; }
        function wouldUseLabel(v) { return {'yes':'Yes','maybe':'Maybe','no':'No'}[v] || v; }

        function getCurrentUserId() {
            return localStorage.getItem('user_id') || '';
        }

        async function loadProject() {
            const content = document.getElementById('content');
            try {
                const [projectRes, responsesRes] = await Promise.all([
                    fetch('/api/projects/' + projectId),
                    fetch('/api/projects/' + projectId + '/responses', { headers: { 'X-Owner-ID': getCurrentUserId() } })
                ]);
                if (!projectRes.ok) throw new Error('Project not found');
                const projectData = await projectRes.json();
                const responses = responsesRes.ok ? await responsesRes.json() : [];
                renderProject(projectData, responses);
            } catch (e) {
                content.innerHTML = '<div class="error-state"><p>Something went wrong. Please try again.</p></div>';
            }
        }

        function renderProject(data, responses) {
            const content = document.getElementById('content');
            const p = data.project;
            const q = data.question;
            let html = '<div class="project-header"><h2 class="project-title">' + escapeHtml(p.title) + '</h2>';
            if (p.description) html += '<p class="project-description">' + escapeHtml(p.description) + '</p>';
            if (p.url) html += '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener" class="project-url">' + escapeHtml(p.url) + '</a>';
            html += '</div>';
            if (q) {
                html += '<div class="question-block"><div class="question-label">The Maker\'s Question</div><div class="question-text">' + escapeHtml(q.text) + '</div></div>';
                html += '<div class="response-form-card"><form id="response-form">';
                html += '<div class="form-section"><h3>How clear is it?</h3><div class="radio-group">';
                html += '<div class="radio-option"><input type="radio" id="c1" name="clarity" value="very_clear" required><label for="c1">Very clear</label></div>';
                html += '<div class="radio-option"><input type="radio" id="c2" name="clarity" value="mostly_clear"><label for="c2">Mostly clear</label></div>';
                html += '<div class="radio-option"><input type="radio" id="c3" name="clarity" value="confusing"><label for="c3">Confusing</label></div>';
                html += '</div></div>';
                html += '<div class="form-section"><h3>Would you use it?</h3><div class="radio-group">';
                html += '<div class="radio-option"><input type="radio" id="u1" name="would_use" value="yes" required><label for="u1">Yes</label></div>';
                html += '<div class="radio-option"><input type="radio" id="u2" name="would_use" value="maybe"><label for="u2">Maybe</label></div>';
                html += '<div class="radio-option"><input type="radio" id="u3" name="would_use" value="no"><label for="u3">No</label></div>';
                html += '</div></div>';
                html += '<div class="form-section"><h3>What would you change? <span style="font-weight:400;color:var(--text-muted);">(optional)</span></h3><textarea class="form-textarea" id="suggestion" maxlength="2000" placeholder="Your honest feedback..."></textarea></div>';
                html += '<button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Submit feedback</button>';
                html += '<div class="message" id="message"></div></form></div>';
                if (responses.length > 0) {
                    html += '<div class="responses-list"><h3>' + responses.length + ' response' + (responses.length !== 1 ? 's' : '') + '</h3>';
                    responses.forEach(function(r) {
                        html += '<div class="response-item"><div class="response-meta"><span>Clarity: ' + clarityLabel(r.clarity) + '</span><span>Would use: ' + wouldUseLabel(r.would_use) + '</span></div>';
                        if (r.suggestion) html += '<p class="response-suggestion">' + escapeHtml(r.suggestion) + '</p>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
            }
            content.innerHTML = html;
            const form = document.getElementById('response-form');
            if (form) form.addEventListener('submit', handleSubmit);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');
            msg.className = 'alert';
            msg.textContent = '';
            btn.disabled = true;

            const csrfToken = getCsrfToken();
            const payload = {
                clarity: document.querySelector('input[name="clarity"]:checked').value,
                would_use: document.querySelector('input[name="would_use"]:checked').value,
                suggestion: document.getElementById('suggestion').value.trim() || null,
            };

            try {
                const response = await fetch('/api/projects/' + projectId + '/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify(payload),
                });
                let data = {};
                try {
                    data = await response.json();
                } catch (jsonError) {
                    data = {};
                }
                if (response.ok) {
                    msg.className = 'alert alert-success';
                    msg.textContent = 'Thank you! Your feedback has been submitted.';
                    document.getElementById('response-form').reset();
                    setTimeout(loadProject, 1500);
                } else if (response.status === 401) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Please login to submit feedback.';
                } else if (response.status === 403) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Session expired. Please refresh.';
                } else {
                    msg.className = 'alert alert-error';
                    msg.textContent = data.detail || 'Failed to submit.';
                }
            } catch (e) {
                console.error('Submit error:', e);
                msg.className = 'alert alert-error';
                msg.textContent = 'Network error: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        loadProject();
    </script>
</body>
</html>

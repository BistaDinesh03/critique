<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects — Critique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.6; min-height: 100vh; }
        header { border-bottom: 1px solid #e5e5e5; padding: 1.5rem 2rem; background: #fff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        header h1 a { color: #1a1a1a; text-decoration: none; }
        header nav { display: flex; gap: 1rem; }
        header nav a { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        main { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .page-title { margin-bottom: 2rem; }
        .page-title h2 { font-size: 1.5rem; font-weight: 700; }
        .project-list { display: flex; flex-direction: column; gap: 1rem; }
        .project-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1.25rem; }
        .project-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .project-description { color: #444; font-size: 0.9rem; margin-bottom: 0.75rem; }
        .project-meta { font-size: 0.85rem; color: #666; margin-bottom: 0.75rem; }
        .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #f3f4f6; color: #444; }
        .btn-danger { background: #ef4444; color: #fff; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #666; }
        .loading, .error { text-align: center; padding: 3rem 1rem; color: #666; }
        .error { color: #991b1b; }
        @media (max-width: 600px) { main { padding: 1rem; } header { padding: 1rem; } }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">Critique</a></h1>
        <nav>
            <a href="/discover">Discover</a>
            <a href="/">Submit</a>
            <a href="/my-projects">My Projects</a>
        </nav>
    </header>
    <main>
        <div class="page-title">
            <h2>My Projects</h2>
        </div>
        <div id="content"><div class="loading">Loading your projects...</div></div>
    </main>
    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        async function loadMyProjects() {
            const content = document.getElementById('content');
            try {
                const response = await fetch('/api/projects/my/list');
                if (!response.ok) {
                    if (response.status === 401) {
                        content.innerHTML = '<div class="error">Please <a href="/auth/login">login</a> to see your projects.</div>';
                    } else {
                        content.innerHTML = '<div class="error">Failed to load projects.</div>';
                    }
                    return;
                }
                const projects = await response.json();
                if (projects.length === 0) {
                    content.innerHTML = '<div class="empty-state"><p>You haven\'t created any projects yet.</p><p style="margin-top:1rem;"><a href="/" class="btn btn-primary">Submit your first project</a></p></div>';
                    return;
                }
                let html = '<div class="project-list">';
                projects.forEach(function(p) {
                    html += '<div class="project-card">';
                    html += '<div class="project-title">' + escapeHtml(p.title) + '</div>';
                    if (p.description) html += '<div class="project-description">' + escapeHtml(p.description) + '</div>';
                    html += '<div class="project-meta">' + p.response_count + ' response' + (p.response_count !== 1 ? 's' : '') + '</div>';
                    html += '<div class="card-actions">';
                    html += '<a href="/project/' + p.id + '" class="btn btn-secondary">View</a>';
                    html += '<a href="/project/' + p.id + '/results" class="btn btn-primary">Results</a>';
                    html += '<button onclick="deleteProject(' + p.id + ')" class="btn btn-danger">Delete</button>';
                    html += '</div></div>';
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = '<div class="error">Failed to load projects.</div>';
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Delete this project? This cannot be undone.')) return;
            const csrfToken = getCsrfToken();
            try {
                const response = await fetch('/api/projects/' + projectId, {
                    method: 'DELETE',
                    headers: { 'X-CSRF-Token': csrfToken },
                });
                if (response.status === 204) {
                    loadMyProjects();
                } else if (response.status === 401) {
                    alert('Please login.');
                } else if (response.status === 403) {
                    alert('You cannot delete this project.');
                } else {
                    alert('Failed to delete. Try again.');
                }
            } catch (e) {
                alert('Network error.');
            }
        }

        loadMyProjects();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .page-title {
            margin-bottom: var(--space-6);
        }

        .page-title h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .page-title p {
            color: var(--text-muted);
            margin-top: var(--space-2);
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
        }

        .project-title {
            font-size: var(--text-lg);
            font-weight: 700;
            margin-bottom: var(--space-1);
        }

        .project-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--space-3);
        }

        .project-meta {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-bottom: var(--space-4);
        }

        .card-actions {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .card-actions {
                flex-direction: column;
            }

            .card-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="" width="24" height="24">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects" aria-current="page">My Projects</a>
            <a href="/">Submit</a>
        </nav>
    </header>

    <main class="container-wide">
        <div class="page-title">
            <h2>My Projects</h2>
            <p>Your projects and the feedback they've received.</p>
        </div>
        <div id="content"><div class="loading-state"><div class="loading-spinner"></div><p>Loading your projects...</p></div></div>
    </main>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        async function loadMyProjects() {
            const content = document.getElementById('content');
            try {
                const response = await fetch('/api/projects/my/list');
                if (!response.ok) {
                    if (response.status === 401) {
                        content.innerHTML = '<div class="empty-state"><h3>Login required</h3><p>Please <a href="/auth/login">login</a> to see your projects.</p></div>';
                    } else {
                        content.innerHTML = '<div class="error-state"><p>Failed to load projects.</p></div>';
                    }
                    return;
                }
                const projects = await response.json();
                if (projects.length === 0) {
                    content.innerHTML = '<div class="empty-state"><h3>No projects yet</h3><p>You haven\'t created any projects yet.</p><a href="/" class="btn btn-primary">Submit your first project</a></div>';
                    return;
                }
                let html = '<div class="project-list">';
                projects.forEach(function(p) {
                    html += '<div class="project-card">';
                    html += '<div class="project-title">' + escapeHtml(p.title) + '</div>';
                    if (p.description) html += '<div class="project-description">' + escapeHtml(p.description) + '</div>';
                    html += '<div class="project-meta">' + p.response_count + ' response' + (p.response_count !== 1 ? 's' : '') + '</div>';
                    html += '<div class="card-actions">';
                    html += '<a href="/project/' + p.id + '" class="btn btn-secondary">View</a>';
                    html += '<a href="/project/' + p.id + '/results" class="btn btn-primary">Results</a>';
                    html += '<button onclick="deleteProject(' + p.id + ')" class="btn btn-danger">Delete</button>';
                    html += '</div></div>';
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = '<div class="error-state"><p>Failed to load projects.</p></div>';
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Delete this project? This cannot be undone.')) return;
            const csrfToken = getCsrfToken();
            try {
                const response = await fetch('/api/projects/' + projectId, {
                    method: 'DELETE',
                    headers: { 'X-CSRF-Token': csrfToken },
                });
                if (response.status === 204) {
                    loadMyProjects();
                } else if (response.status === 401) {
                    alert('Please login.');
                } else if (response.status === 403) {
                    alert('You cannot delete this project.');
                } else {
                    alert('Failed to delete. Try again.');
                }
            } catch (e) {
                alert('Network error.');
            }
        }

        loadMyProjects();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .page-title {
            margin-bottom: var(--space-6);
        }

        .page-title h2 {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .page-title p {
            color: var(--text-muted);
            margin-top: var(--space-2);
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
            max-width: 1100px;
            margin: 0 auto;
        }



        @media (max-width: 699px) {
            .project-list {
                grid-template-columns: 1fr;
            }
        }

        .project-screenshot {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: var(--surface-muted);
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .project-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        .project-card-body {
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: var(--space-3);
        }

        .project-title {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            overflow-wrap: anywhere;
            min-height: 1.3em;
        }

        .project-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            min-height: 3em;
        }

        .project-meta {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .response-badge {
            display: inline-block;
            padding: var(--space-1) var(--space-3);
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 600;
            background: var(--surface-muted);
            color: var(--text-secondary);
        }

        .card-actions {
            margin-top: auto;
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-light, #eee);
            display: flex;
            gap: var(--space-2);
            align-items: center;
        }

        .card-actions .btn {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .card-actions .spacer {
            flex: 1;
        }

        @media (max-width: 600px) {
            .card-actions {
                flex-wrap: wrap;
            }

            .card-actions .btn {
                flex: 1;
                justify-content: center;
            }

            .card-actions .spacer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects" aria-current="page">My Projects</a>
            <a href="/#submit" class="btn-nav">Submit a project</a>
            <a href="/auth/login" class="btn-nav" id="login-btn" aria-label="Login with GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn" style="display:none;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h2v7H6zM2.5 2.5l1.4 1.4A5 5 0 1 0 8 3V1a7 7 0 1 1-5.5 1.5z"/></svg>  Logout</a>
        </nav>
    </header>

    <main class="container-wide">
        <div class="page-title">
            <h2>My Projects</h2>
            <p>Your projects and the feedback they've received.</p>
        </div>
        <div id="content"><div class="loading-state"><div class="loading-spinner"></div><p>Loading your projects...</p></div></div>
    </main>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        async function fetchWithRetry(url, options, maxRetries) {
    maxRetries = maxRetries || 3;
    let lastError;
    for (let i = 0; i < maxRetries; i++) {
        try {
            const response = await fetch(url, options);
            if (response.status === 503 || response.status === 500) {
                throw new Error('Server waking up');
            }
            return response;
        } catch (e) {
            lastError = e;
            if (i < maxRetries - 1) {
                const delay = Math.min(1000 * Math.pow(2, i), 4000);
                await new Promise(function(resolve) { setTimeout(resolve, delay); });
            }
        }
    }
    throw lastError;
}

async function loadMyProjects() {
            const content = document.getElementById('content');
            try {
                const response = await fetchWithRetry('/api/projects/my/list');
                if (!response.ok) {
                    if (response.status === 401) {
                        content.innerHTML = '<div class="empty-state"><h3>Login required</h3><p>Please <a href="/auth/login">login</a> to see your projects.</p></div>';
                    } else {
                        content.innerHTML = '<div class="error-state"><p>Failed to load projects.</p></div>';
                    }
                    return;
                }
                const projects = await response.json();
                if (projects.length === 0) {
                    content.innerHTML = '<div class="empty-state"><h3>No projects yet</h3><p>You haven\'t created any projects yet.</p><a href="/" class="btn btn-primary">Submit your first project</a></div>';
                    return;
                }
                let html = '<div class="project-list">';
                projects.forEach(function(p) {
                    html += '<div class="project-card">';
                    if (p.image_url) { html += '<img class="project-screenshot" src="' + escapeHtml(p.image_url) + '" alt="Screenshot" loading="lazy" onerror="this.style.display=\'none\'">'; }
                    html += '<div class="project-card-body">';
                    html += '<div class="project-title">' + escapeHtml(p.title) + '</span></div>';
                    if (p.description) html += '<div class="project-description">' + escapeHtml(p.description) + '</div>';
                    html += '<div class="project-meta"><span class="response-badge">' + p.response_count === 0 ? 'No responses yet' : p.response_count + ' response' + (p.response_count !== 1 ? 's' : '') + '</div>';
                    html += '<div class="card-actions">';
                    html += '<a href="/project/' + p.id + '" class="btn btn-secondary">View</a>';
                    html += '<a href="/project/' + p.id + '/results" class="btn btn-primary">Results</a>';
                    html += '<button onclick="copyProjectLink(' + p.id + ')" class="btn btn-ghost" aria-label="Copy project link">Copy link</button>';
                    html += '<button onclick="deleteProject(' + p.id + ', \'' + escapeHtml(p.title).replace(/\'/g, '\\\'') + '\')" class="btn btn-ghost" style="color:var(--danger);" aria-label="Delete project">Delete</button>';
                    html += '</div></div></div>';
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = '<div class="error-state"><p>Failed to load projects.</p></div>';
            }
        }

        function deleteProject(projectId, projectTitle) {
            CritiqueUI.showConfirmModal({
                title: 'Delete project?',
                message: 'This will permanently delete "' + projectTitle + '" and its feedback. This action cannot be undone.',
                confirmText: 'Delete project',
                cancelText: 'Cancel',
                destructive: true,
                onConfirm: function(success, fail) {
                    const csrfToken = getCsrfToken();
                    fetch('/api/projects/' + projectId, {
                        method: 'DELETE',
                        headers: { 'X-CSRF-Token': csrfToken },
                    })
                    .then(function(response) {
                        if (response.status === 204) {
                            success();
                            CritiqueUI.showToast('Project deleted', 'success');
                            loadMyProjects();
                        } else if (response.status === 401) {
                            fail();
                            CritiqueUI.showToast('Please login.', 'error');
                        } else if (response.status === 403) {
                            fail();
                            CritiqueUI.showToast('You cannot delete this project.', 'error');
                        } else {
                            fail();
                            CritiqueUI.showToast('Could not delete the project. Please try again.', 'error');
                        }
                    })
                    .catch(function() {
                        fail();
                        CritiqueUI.showToast('Connection problem. Check your connection and try again.', 'error');
                    });
                }
            });
        }

        function copyProjectLink(projectId) {
            var url = window.location.origin + '/project/' + projectId;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    CritiqueUI.showToast('Project link copied', 'success');
                }).catch(function() {
                    CritiqueUI.showToast('Could not copy the link', 'error');
                });
            } else {
                CritiqueUI.showToast('Could not copy the link', 'error');
            }
        }

        loadMyProjects();
    
        async function checkAuth() {
            try {
                const response = await fetch('/auth/check', { credentials: 'same-origin' });
                if (response.status === 200) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                } else {
                    document.getElementById('login-btn').style.display = 'inline';
                    document.getElementById('logout-btn').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('login-btn').style.display = 'inline';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

            try { checkAuth(); } catch(e) {}
    </script>
    <script src="/static/ui.js"></script>
</body>
</html>

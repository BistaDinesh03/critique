<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects — Critique</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-4);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .page-header h1 {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: var(--text-sm);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border-color: #cbd5e1;
        }

        .project-image {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #f1f5f9;
        }

        .project-info {
            padding: var(--space-4);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .project-title {
            font-size: var(--text-base);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .project-desc {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .response-pill {
            display: inline-block;
            font-size: var(--text-xs);
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .response-pill.has-feedback {
            background: #f0fdf4;
            color: #166534;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding-top: var(--space-3);
            border-top: 1px solid #e5e7eb;
            margin-top: auto;
        }

        .card-actions .btn {
            font-size: var(--text-sm);
            font-weight: 600;
            padding: var(--space-2) var(--space-4);
            border-radius: 6px;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .spacer {
            flex: 1;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #dc2626;
            font-size: var(--text-sm);
            cursor: pointer;
            padding: var(--space-2);
            border-radius: 4px;
        }

        .btn-delete:hover {
            background: #fef2f2;
        }

        .empty-container {
            text-align: center;
            padding: var(--space-8);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .empty-container h2 {
            font-size: var(--text-xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }

        .empty-container p {
            color: var(--text-muted);
            margin-bottom: var(--space-4);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects" aria-current="page">My Projects</a>
            <a href="/#submit" class="btn-nav">Submit a project</a>
            <a href="/auth/login" class="btn-nav" id="login-btn">Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn" style="display:none;">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1>My Projects</h1>
                <p>Track feedback on what you've built.</p>
            </div>
            <a href="/#submit" class="btn btn-primary">Submit Project</a>
        </div>

        <div id="content">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading projects...</p>
            </div>
        </div>
    </main>

    <script>
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCsrfToken() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var parts = cookies[i].trim().split('=');
                if (parts[0] === 'critique_csrf') return decodeURIComponent(parts[1]);
            }
            return '';
        }

        async function checkAuth() {
            try {
                var response = await fetch('/auth/check', { credentials: 'same-origin' });
                if (response.status === 200) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                }
            } catch (e) {}
        }

        async function loadProjects() {
            var content = document.getElementById('content');
            try {
                var response = await fetch('/api/projects/my/list');
                if (!response.ok) {
                    if (response.status === 401) {
                        content.innerHTML = '<div class="empty-container"><h2>Sign in required</h2><p>Sign in with GitHub to manage your projects.</p><a href="/auth/login" class="btn btn-primary">Continue with GitHub</a></div>';
                    } else {
                        content.innerHTML = '<div class="empty-container"><h2>Could not load projects</h2><p>Something went wrong.</p><button onclick="loadProjects()" class="btn btn-secondary">Try again</button></div>';
                    }
                    return;
                }

                var projects = await response.json();
                if (projects.length === 0) {
                    content.innerHTML = '<div class="empty-container"><h2>No projects yet</h2><p>Share something you have built and ask one question you genuinely want answered.</p><a href="/#submit" class="btn btn-primary">Submit your first project</a></div>';
                    return;
                }

                var html = '<div class="projects-grid">';
                projects.forEach(function(p) {
                    var count = p.response_count || 0;
                    var pillClass = count > 0 ? 'response-pill has-feedback' : 'response-pill';
                    var pillText = count === 0 ? 'No responses yet' : count + ' response' + (count !== 1 ? 's' : '');

                    html += '<div class="project-card">';
                    if (p.image_url) {
                        html += '<img class="project-image" src="' + escapeHtml(p.image_url) + '" alt="" loading="lazy">';
                    }
                    html += '<div class="project-info">';
                    html += '<div class="project-title">' + escapeHtml(p.title) + '</div>';
                    if (p.description) {
                        html += '<div class="project-desc">' + escapeHtml(p.description) + '</div>';
                    }
                    html += '<div><span class="' + pillClass + '">' + pillText + '</span></div>';
                    html += '<div class="card-actions">';
                    html += '<a href="/project/' + p.id + '/results" class="btn btn-primary">View Feedback</a>';
                    html += '<button onclick="copyLink(' + p.id + ')" class="btn btn-secondary">Share</button>';
                    html += '<span class="spacer"></span>';
                    html += '<button onclick="deleteProject(' + p.id + ')" data-title="' + escapeHtml(p.title) + '" class="btn-delete">Delete</button>';
                    html += '</div>';
                    html += '</div>';
                    html += '</div>';
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = '<div class="empty-container"><h2>Connection problem</h2><p>Check your connection and try again.</p><button onclick="loadProjects()" class="btn btn-secondary">Try again</button></div>';
            }
        }

        function copyLink(projectId) {
            var url = window.location.origin + '/project/' + projectId;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() {
                    CritiqueUI.showToast('Link copied', 'success');
                }).catch(function() {
                    CritiqueUI.showToast('Could not copy link', 'error');
                });
            }
        }

        function deleteProject(projectId) {
            var projectTitle = event.target.getAttribute('data-title') || 'This project';
            CritiqueUI.showConfirmModal({
                title: 'Delete project?',
                message: 'This will permanently delete "' + projectTitle + '" and its feedback.',
                confirmText: 'Delete',
                cancelText: 'Cancel',
                destructive: true,
                onConfirm: function(success, fail) {
                    var csrfToken = getCsrfToken();
                    fetch('/api/projects/' + projectId, {
                        method: 'DELETE',
                        headers: { 'X-CSRF-Token': csrfToken },
                    }).then(function(response) {
                        if (response.status === 204) {
                            success();
                            CritiqueUI.showToast('Project deleted', 'success');
                            loadProjects();
                        } else {
                            fail();
                            CritiqueUI.showToast('Could not delete. Try again.', 'error');
                        }
                    }).catch(function() {
                        fail();
                        CritiqueUI.showToast('Connection problem', 'error');
                    });
                }
            });
        }

        checkAuth();
        loadProjects();
    </script>
    <script src="/static/ui.js"></script>
</body>
</html>

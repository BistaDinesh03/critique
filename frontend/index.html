<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critique — Ask one question. Get real answers.</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        .hero {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .hero h2 {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-3);
            letter-spacing: -0.02em;
        }

        .hero .tagline {
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
        }

        .hero .supporting {
            font-size: var(--text-base);
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto var(--space-5);
        }

        .hero-actions {
            display: flex;
            gap: var(--space-3);
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: var(--space-8);
        }

        .question-highlight {
            border-left: 3px solid var(--accent);
            padding: var(--space-3) var(--space-4);
            background: var(--surface-muted);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-bottom: var(--space-4);
        }

        .question-highlight label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: block;
            margin-bottom: var(--space-1);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.svg" alt="Critique" width="32" height="32">
            Critique
        </a>
        <nav class="navbar-nav" aria-label="Main navigation">
            <a href="/discover">Discover</a>
            <a href="/my-projects">My Projects</a>
            <a href="/auth/login" class="btn-nav" id="login-btn" aria-label="Login with GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> Login</a>
            <a href="/auth/logout" class="btn-nav" id="logout-btn" style="display:none;">Logout</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Ask one question.<br>Get real answers.</h2>
            <p class="tagline">Critique</p>
            <p class="supporting">Show people what you built. Ask the question you're stuck on. Get honest human feedback.</p>
            <div class="hero-actions">
                <a href="#submit" class="btn btn-primary">Submit your project</a>
                <a href="/discover" class="btn btn-secondary">Discover projects</a>
            </div>
        </section>

        <section id="submit" class="card">
            <form id="project-form">
                <h2 style="font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-5);">Submit your project</h2>

                <div class="form-group">
                    <label class="form-label" for="title">Project title</label>
                    <input class="form-input" type="text" id="title" name="title" required maxlength="200" placeholder="Akiya Scout">
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Short description</label>
                    <textarea class="form-textarea" id="description" name="description" maxlength="5000" placeholder="Find abandoned houses in Japan"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="url">Project URL</label>
                    <input class="form-input" type="url" id="url" name="url" maxlength="500" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="image_url">Screenshot URL <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>
                    <input class="form-input" type="url" id="image_url" name="image_url" maxlength="500" placeholder="https://example.com/screenshot.png">
                </div>

                <hr style="border:none;border-top:1px solid var(--border);margin:var(--space-5) 0;">

                <div class="form-group">
                    <div class="question-highlight">
                        <label for="question">Your ONE question</label>
                        <textarea class="form-textarea" id="question" name="question" required maxlength="500" placeholder="Can you understand what this website does within 10 seconds?" style="min-height:80px;"></textarea>
                        <p class="form-helper">Ask one specific question you genuinely want answered.</p>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">Submit for feedback</button>
                <div class="message" id="message"></div>
            </form>
        </section>
    </main>

    <script>
        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'critique_csrf') return decodeURIComponent(value);
            }
            return '';
        }

        async function checkAuth() {
            try {
                const response = await fetch('/auth/check');
                if (response.ok) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline';
                }
            } catch (e) {}
        }

        document.getElementById('project-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.className = 'alert';
            msg.textContent = '';

            const csrfToken = getCsrfToken();
            const payload = {
                project_data: {
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim() || null,
                    url: document.getElementById('url').value.trim() || null,
                    image_url: document.getElementById('image_url').value.trim() || null,
                },
                question_data: { text: document.getElementById('question').value.trim() }
            };

            try {
                const response = await fetch('/api/projects/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify(payload),
                });
                const data = await response.json();
                if (response.ok) {
                    msg.className = 'alert alert-success';
                    msg.textContent = 'Project submitted successfully!';
                    document.getElementById('project-form').reset();
                } else if (response.status === 401) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Please login with GitHub to submit.';
                } else if (response.status === 403) {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Session expired. Please refresh and try again.';
                } else {
                    msg.className = 'alert alert-error';
                    msg.textContent = 'Error: ' + JSON.stringify(data);
                }
            } catch (error) {
                msg.className = 'alert alert-error';
                msg.textContent = 'Network error.';
            }
        });

        checkAuth();
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Critique Product Analytics Overview</title>
  <desc id="desc">Analytics snapshot showing product reach, feedback activity, project activity, authentication, and improvement opportunities. Event counts, not unique users. Reporting period not specified.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Critique Product Analytics</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif">Analytics snapshot — reporting period not specified. Event counts, not unique users.</text>

  <!-- Section A: Product Reach -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" fill="#60a5fa" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">PRODUCT REACH</text>
    <rect x="0" y="12" width="200" height="70" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <text x="100" y="42" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" font-family="system-ui, -apple-system, sans-serif">466</text>
    <text x="100" y="62" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Unique visitors</text>

    <rect x="215" y="12" width="200" height="70" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <text x="315" y="42" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2,169</text>
    <text x="315" y="62" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Page views</text>

    <rect x="430" y="12" width="200" height="70" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <text x="530" y="42" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" font-family="system-ui, -apple-system, sans-serif">449</text>
    <text x="530" y="62" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Discover views</text>

    <rect x="645" y="12" width="200" height="70" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <text x="745" y="42" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" font-family="system-ui, -apple-system, sans-serif">292</text>
    <text x="745" y="62" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Project views</text>
  </g>

  <!-- Traffic chart -->
  <g transform="translate(30, 185)">
    <text x="0" y="0" fill="#60a5fa" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">TRAFFIC OVERVIEW</text>
    <rect x="0" y="12" width="840" height="120" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <!-- Page views bar -->
    <text x="15" y="40" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Page views</text>
    <rect x="120" y="28" width="680" height="18" rx="4" fill="#334155"/>
    <rect x="120" y="28" width="680" height="18" rx="4" fill="url(#blueGrad)"/>
    <text x="810" y="42" text-anchor="end" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">2,169</text>
    <!-- Discover views bar -->
    <text x="15" y="68" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Discover views</text>
    <rect x="120" y="56" width="680" height="18" rx="4" fill="#334155"/>
    <rect x="120" y="56" width="141" height="18" rx="4" fill="url(#purpleGrad)"/>
    <text x="270" y="70" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">449</text>
    <!-- Project views bar -->
    <text x="15" y="96" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Project views</text>
    <rect x="120" y="84" width="680" height="18" rx="4" fill="#334155"/>
    <rect x="120" y="84" width="92" height="18" rx="4" fill="url(#cyanGrad)"/>
    <text x="220" y="98" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">292</text>
  </g>

  <!-- Section B: Feedback Activity -->
  <g transform="translate(30, 330)">
    <text x="0" y="0" fill="#a78bfa" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">FEEDBACK ACTIVITY</text>
    <rect x="0" y="12" width="410" height="120" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <!-- Feedback starts -->
    <text x="15" y="38" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Feedback starts</text>
    <rect x="150" y="26" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="26" width="240" height="16" rx="4" fill="url(#purpleGrad)"/>
    <text x="400" y="40" text-anchor="end" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">103</text>
    <!-- Submit attempts -->
    <text x="15" y="62" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Submit attempts</text>
    <rect x="150" y="50" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="50" width="184" height="16" rx="4" fill="url(#blueGrad)"/>
    <text x="342" y="64" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">79</text>
    <!-- Successful submits -->
    <text x="15" y="86" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Successful submits</text>
    <rect x="150" y="74" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="74" width="58" height="16" rx="4" fill="url(#greenGrad)"/>
    <text x="216" y="88" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">25</text>
    <!-- Feedback resumes -->
    <text x="15" y="110" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Feedback resumes</text>
    <rect x="150" y="98" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="98" width="51" height="16" rx="4" fill="url(#cyanGrad)"/>
    <text x="209" y="112" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">22</text>
  </g>

  <!-- Section C: Project Activity -->
  <g transform="translate(460, 330)">
    <text x="0" y="0" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">PROJECT ACTIVITY</text>
    <rect x="0" y="12" width="410" height="120" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="26" width="180" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="105" y="50" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">23</text>
    <text x="105" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Project submissions</text>

    <rect x="215" y="26" width="180" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="305" y="50" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">42</text>
    <text x="305" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Feedback form views</text>

    <rect x="15" y="86" width="380" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="205" y="102" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Project views / page views: 13.5%  |  Feedback starts / project views: 35.3%</text>
    <text x="205" y="116" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Feedback submits / starts: 24.3%  |  Project submits / feedback submits: 92.0%</text>
  </g>

  <!-- Section D: Authentication -->
  <g transform="translate(30, 475)">
    <text x="0" y="0" fill="#fb923c" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">AUTHENTICATION</text>
    <rect x="0" y="12" width="410" height="120" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <!-- Login prompts -->
    <text x="15" y="38" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Login prompts</text>
    <rect x="150" y="26" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="26" width="240" height="16" rx="4" fill="url(#orangeGrad)"/>
    <text x="400" y="40" text-anchor="end" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">208</text>
    <!-- Login starts -->
    <text x="15" y="62" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Login starts</text>
    <rect x="150" y="50" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="50" width="90" height="16" rx="4" fill="url(#orangeGrad)"/>
    <text x="248" y="64" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">78</text>
    <!-- Successful logins -->
    <text x="15" y="86" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Successful logins</text>
    <rect x="150" y="74" width="240" height="16" rx="4" fill="#334155"/>
    <rect x="150" y="74" width="25" height="16" rx="4" fill="url(#greenGrad)"/>
    <text x="183" y="88" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">22</text>
    <!-- Auth method breakdown -->
    <text x="15" y="110" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">GitHub / Email</text>
    <rect x="150" y="98" width="140" height="16" rx="4" fill="url(#blueGrad)"/>
    <rect x="290" y="98" width="100" height="16" rx="4" fill="url(#purpleGrad)"/>
    <text x="220" y="112" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">64 (58.7%)</text>
    <text x="340" y="112" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">45 (41.3%)</text>
  </g>

  <!-- Section E: Email Verification -->
  <g transform="translate(460, 475)">
    <text x="0" y="0" fill="#22d3ee" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">EMAIL VERIFICATION</text>
    <rect x="0" y="12" width="410" height="120" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="26" width="180" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="105" y="50" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">22</text>
    <text x="105" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Emails sent</text>

    <rect x="215" y="26" width="180" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="305" y="50" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">9</text>
    <text x="305" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Verified (40.9%)</text>

    <rect x="15" y="86" width="380" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="205" y="102" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">4 already-responded events  |  22 feedback resumes</text>
    <text x="205" y="116" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Verification success rate is low — investigate email delivery</text>
  </g>

  <!-- Section F: Improvement Opportunities -->
  <g transform="translate(30, 620)">
    <text x="0" y="0" fill="#fb923c" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">IMPROVEMENT OPPORTUNITIES</text>
    <rect x="0" y="12" width="840" height="80" rx="8" fill="#1e293b" filter="url(#cardShadow)" stroke="#f97316" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Error rate highlight -->
    <rect x="15" y="26" width="260" height="52" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="145" y="48" text-anchor="middle" fill="#ef4444" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">41.8%</text>
    <text x="145" y="66" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Feedback submission error rate</text>
    <text x="145" y="78" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, sans-serif">33 errors / 79 attempts</text>

    <!-- Sharing activity -->
    <rect x="290" y="26" width="260" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="420" y="48" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">28 / 9 / 2 / 0</text>
    <text x="420" y="66" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Share UI shown / clicked / post-copied / link-copied</text>

    <!-- Feedback form views -->
    <rect x="565" y="26" width="260" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="695" y="48" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600" font-family="system-ui, -apple-system, sans-serif">42</text>
    <text x="695" y="66" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Feedback form views</text>
    <text x="695" y="78" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, sans-serif">103 feedback starts recorded</text>
  </g>

  <!-- Footer -->
  <text x="450" y="710" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif">Analytics snapshot — reporting period not specified. Event counts, not unique users. | Critique — Ask one question. Get real answers.</text>
</svg>
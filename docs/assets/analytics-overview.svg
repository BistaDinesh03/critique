<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Critique — Project Activity Snapshot</title>
  <desc id="desc">Latest available analytics snapshot. Event counts, not unique-user conversion rates. Reporting period not specified.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Critique — Project Activity Snapshot</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Latest available snapshot. Reporting period not specified.</text>

  <!-- Section 1: Product Reach -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" fill="#60a5fa" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">PRODUCT REACH</text>
    <rect x="0" y="12" width="175" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="87" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">473</text>
    <text x="87" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Unique visitors</text>

    <rect x="190" y="12" width="175" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="277" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2,180</text>
    <text x="277" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Page views</text>

    <rect x="380" y="12" width="175" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="467" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">454</text>
    <text x="467" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Discover views</text>

    <rect x="570" y="12" width="175" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="657" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">295</text>
    <text x="657" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Project views</text>
  </g>

  <!-- Section 2: Feedback Activity -->
  <g transform="translate(30, 155)">
    <text x="0" y="0" fill="#a78bfa" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">FEEDBACK ACTIVITY</text>
    <rect x="0" y="10" width="360" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <text x="12" y="34" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Feedback starts</text>
    <rect x="140" y="22" width="200" height="16" rx="4" fill="#334155"/>
    <rect x="140" y="22" width="200" height="16" rx="4" fill="url(#purpleBar)"/>
    <text x="348" y="35" text-anchor="end" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">103</text>

    <text x="12" y="58" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Submit attempts</text>
    <rect x="140" y="46" width="200" height="16" rx="4" fill="#334155"/>
    <rect x="140" y="46" width="154" height="16" rx="4" fill="url(#blueBar)"/>
    <text x="302" y="59" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">79</text>

    <text x="12" y="82" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Successful</text>
    <rect x="140" y="70" width="200" height="16" rx="4" fill="#334155"/>
    <rect x="140" y="70" width="49" height="16" rx="4" fill="url(#greenBar)"/>
    <text x="197" y="83" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">25</text>

    <text x="12" y="106" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Errors</text>
    <rect x="140" y="94" width="200" height="16" rx="4" fill="#334155"/>
    <rect x="140" y="94" width="83" height="16" rx="4" fill="url(#redBar)"/>
    <text x="231" y="107" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">33</text>
  </g>

  <!-- Section 3: Engagement Ratios -->
  <g transform="translate(410, 155)">
    <text x="0" y="0" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">ENGAGEMENT RATIOS</text>
    <text x="0" y="14" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, sans-serif">Event ratios, not unique-user conversion rates</text>
    <rect x="0" y="22" width="360" height="108" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <rect x="15" y="34" width="330" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="49" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Feedback starts / project views</text>
    <text x="335" y="49" text-anchor="end" fill="#f1f5f9" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">34.9%</text>

    <rect x="15" y="62" width="330" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="77" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Feedback submits / feedback starts</text>
    <text x="335" y="77" text-anchor="end" fill="#f1f5f9" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">24.3%</text>

    <rect x="15" y="90" width="330" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="105" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Successful submits / attempts</text>
    <text x="335" y="105" text-anchor="end" fill="#f1f5f9" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">31.6%</text>
  </g>

  <!-- Section 4: Improvement Opportunities -->
  <g transform="translate(30, 300)">
    <text x="0" y="0" fill="#fb923c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">IMPROVEMENT OPPORTUNITIES</text>
    <rect x="0" y="10" width="740" height="70" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>

    <rect x="15" y="24" width="230" height="46" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="130" y="44" text-anchor="middle" fill="#ef4444" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">41.8%</text>
    <text x="130" y="60" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Feedback submission error rate</text>
    <text x="130" y="72" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui, -apple-system, sans-serif">33 errors / 79 attempts</text>

    <rect x="255" y="24" width="230" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="370" y="44" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">28 / 9 / 2 / 0</text>
    <text x="370" y="60" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Share UI / clicked / post-copied / link-copied</text>
    <text x="370" y="72" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui, -apple-system, sans-serif">Sharing feature has low adoption</text>

    <rect x="495" y="24" width="230" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="610" y="44" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">45</text>
    <text x="610" y="60" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Feedback form views</text>
    <text x="610" y="72" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui, -apple-system, sans-serif">103 feedback starts recorded</text>
  </g>

  <!-- Footer -->
  <text x="400" y="400" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif">Event counts are not unique-user counts. Reporting period not specified.</text>
  <text x="400" y="416" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif">Critique — Ask one question. Get real answers. — https://critique.page</text>
  <text x="400" y="432" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, sans-serif">Live dashboard: https://critique.page/api/analytics/dashboard</text>
</svg>
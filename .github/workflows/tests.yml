name: tests
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Normally task finishes in <2 min; a hang is a bug, so fail fast instead of waiting 6h.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: python -m pytest tests/ -q
        working-directory: backend
        env:
          # See docs/pull-request-review.md: without this the OAuth state test
          # fails on any machine that has no .env -- including this runner.
          # The variable is OAUTH_CLIENT_ID because GitHub rejects names that
          # start with "GITHUB_" (HTTP 422); the app's own setting keeps its
          # name GITHUB_CLIENT_ID.
          # GitHub withholds repository variables from workflows triggered by
          # pull requests from forks, so those runs get the fallback literal --
          # enough for the test's contract (the authorize URL must carry
          # whatever is configured). Push runs to main receive the real value.
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID || 'ci-test-client-id' }}

  production-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify PostgreSQL driver import
        run: |
          python -c "import psycopg; print('psycopg', psycopg.__version__)"
          python -c "from sqlalchemy import create_engine; e = create_engine('postgresql+psycopg://user:pass@localhost/db'); print('dialect OK', e.dialect.driver)"
      - name: Run production dependency smoke tests
        working-directory: backend
        env:
          GITHUB_CLIENT_ID: ci-test-client-id
          DATABASE_URL: "sqlite:///./smoke_test.db"
        run: python -m pytest tests/test_production_deps.py -q
